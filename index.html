<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ARIA — AI Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}

/* ====== TOKENS ====== */
:root{
  /* Slate Dark — warm neutral, easy on eyes for hours */
  --bg:        #16161a;
  --bg2:       #1c1c21;
  --surface:   #242428;
  --surface2:  #2c2c32;
  --sidebar:   #111115;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.11);

  --text:      #dcdce8;   /* warm off-white, not harsh */
  --text2:     #a0a0b8;
  --muted:     #6a6a82;
  --dim:       #3a3a48;

  --accent:    #5b82f7;   /* professional blue */
  --accent-h:  #7a9bf9;
  --accent-bg: rgba(91,130,247,.1);
  --green:     #34c97a;
  --red:       #f87171;
  --yellow:    #fbbf24;

  --code-bg:   #0f0f13;
  --code-text: #e2e0ff;

  --radius:    10px;
  --sidebar-w: 256px;
  --font:      'Inter', system-ui, sans-serif;
  --mono:      'JetBrains Mono', 'Fira Code', monospace;
}

/* Light theme — warm parchment, not clinical white */
.light{
  --bg:        #f4f3ef;
  --bg2:       #eeede8;
  --surface:   #ffffff;
  --surface2:  #f0efe9;
  --sidebar:   #e8e7e1;
  --border:    rgba(0,0,0,0.08);
  --border2:   rgba(0,0,0,0.13);
  --text:      #1e1e28;
  --text2:     #4a4a60;
  --muted:     #7a7a92;
  --dim:       #c0bfba;
  --accent:    #3b6cf5;
  --accent-h:  #2a5ae0;
  --accent-bg: rgba(59,108,245,.08);
  --code-bg:   #1e1e28;
  --code-text: #e2e0ff;
}

html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;font-size:15px;line-height:1.6;}

/* ====== LAYOUT ====== */
.app{display:flex;height:100vh;}

/* ====== SIDEBAR ====== */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
}

.sb-header{
  padding:16px 14px 10px;
  border-bottom:1px solid var(--border);
}
.logo{
  display:flex;align-items:center;gap:9px;
  padding:0 2px;
  margin-bottom:12px;
  text-decoration:none;
}
.logo-mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;
  flex-shrink:0;
}
.logo-name{
  font-size:15px;font-weight:600;color:var(--text);
  letter-spacing:-.2px;
}
.logo-tag{
  font-size:10px;color:var(--muted);
  font-weight:400;margin-left:2px;
}

.btn-new{
  width:100%;padding:8px 12px;
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius);color:var(--text2);
  cursor:pointer;font-size:13px;font-family:var(--font);
  transition:all .14s;text-align:left;
}
.btn-new:hover{background:var(--surface2);color:var(--text);border-color:var(--accent);}
.btn-new .kb{margin-left:auto;font-size:11px;color:var(--dim);background:var(--bg2);padding:2px 5px;border-radius:4px;}

.sb-section{padding:8px 14px 4px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}

.convs{flex:1;overflow-y:auto;padding:4px 6px;}
.convs::-webkit-scrollbar{width:3px;}
.convs::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px;}

.conv-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:8px;
  cursor:pointer;color:var(--text2);font-size:13px;
  transition:all .12s;margin-bottom:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.conv-item:hover{background:var(--surface);color:var(--text);}
.conv-item.active{
  background:var(--accent-bg);
  color:var(--accent-h);
}
.conv-item svg{flex-shrink:0;opacity:.5;}

.sb-bottom{
  padding:10px 14px 14px;
  border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:6px;
}
.theme-toggle{
  display:flex;background:var(--bg2);border-radius:8px;
  padding:3px;border:1px solid var(--border);
}
.t-btn{
  flex:1;padding:5px 8px;
  border:none;border-radius:6px;background:none;
  font-size:12px;font-family:var(--font);color:var(--muted);
  cursor:pointer;transition:all .12s;
}
.t-btn.on{background:var(--surface);color:var(--text);}
.sb-hint{font-size:11px;color:var(--dim);text-align:center;}

/* ====== MAIN ====== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}

/* ====== TOOLBAR ====== */
.toolbar{
  height:52px;
  padding:0 20px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
  flex-shrink:0;
}

.model-group{
  display:flex;align-items:center;gap:2px;
  background:var(--bg);border:1px solid var(--border2);
  border-radius:8px;padding:3px;
}
.m-btn{
  padding:5px 14px;border-radius:6px;
  border:none;background:none;
  font-size:12px;font-weight:500;font-family:var(--font);
  color:var(--muted);cursor:pointer;transition:all .12s;
  white-space:nowrap;
}
.m-btn.on{background:var(--accent);color:#fff;}
.m-btn:not(.on):hover{background:var(--surface2);color:var(--text);}

.divider{width:1px;height:20px;background:var(--border2);margin:0 4px;}

.status{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--muted);
}
.live-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 2px rgba(52,201,122,.25);
}
.toolbar-right{margin-left:auto;display:flex;gap:8px;}
.icon-btn{
  width:32px;height:32px;border-radius:8px;
  border:1px solid var(--border2);
  background:none;color:var(--muted);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .12s;
}
.icon-btn:hover{background:var(--surface);color:var(--text);border-color:var(--border2);}

/* ====== CHAT ====== */
.chat-scroll{
  flex:1;overflow-y:auto;
  scroll-behavior:smooth;
}
.chat-scroll::-webkit-scrollbar{width:5px;}
.chat-scroll::-webkit-scrollbar-thumb{background:var(--dim);border-radius:3px;}
.chat-scroll::-webkit-scrollbar-track{background:transparent;}

.chat-body{
  max-width:780px;margin:0 auto;
  padding:40px 32px 24px;
}

/* Empty */
.welcome{
  display:flex;flex-direction:column;
  align-items:flex-start;
  padding:20px 0 40px;
}
.welcome h1{
  font-size:26px;font-weight:600;
  color:var(--text);margin-bottom:6px;
  letter-spacing:-.5px;
}
.welcome p{color:var(--text2);font-size:15px;margin-bottom:28px;}

.starter-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;width:100%;
}
.starter{
  padding:14px 16px;
  border:1px solid var(--border2);
  border-radius:var(--radius);
  cursor:pointer;transition:all .15s;
  background:var(--surface);
}
.starter:hover{
  border-color:var(--accent);
  background:var(--accent-bg);
}
.starter-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;}
.starter-sub{font-size:12px;color:var(--muted);}

/* Rows */
.msg-row{
  display:flex;gap:14px;
  padding:20px 0;
  border-bottom:1px solid var(--border);
  animation:msgIn .18s ease;
}
.msg-row:last-child{border-bottom:none;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.row-avatar{
  flex-shrink:0;margin-top:2px;
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;
}
.row-avatar.user{background:var(--surface2);color:var(--text2);}
.row-avatar.aria{background:var(--accent);color:#fff;}

.row-content{flex:1;min-width:0;}
.row-meta{
  display:flex;align-items:baseline;gap:10px;
  margin-bottom:8px;
}
.row-name{font-size:13px;font-weight:600;color:var(--text);}
.row-time{font-size:11px;color:var(--dim);}

.row-text{
  font-size:15px;line-height:1.75;color:var(--text);
  white-space:pre-wrap;word-break:break-word;
}

/* AI response prose */
.prose{font-size:15px;line-height:1.8;color:var(--text);}
.prose p{margin-bottom:12px;}
.prose p:last-child{margin-bottom:0;}
.prose h1{font-size:19px;font-weight:600;margin:20px 0 10px;color:var(--text);}
.prose h2{font-size:17px;font-weight:600;margin:18px 0 8px;color:var(--text);}
.prose h3{font-size:15px;font-weight:600;margin:14px 0 6px;color:var(--text);}
.prose ul,.prose ol{padding-left:22px;margin:10px 0;}
.prose li{margin:5px 0;}
.prose strong{font-weight:600;color:var(--text);}
.prose em{color:var(--text2);font-style:italic;}
.prose a{color:var(--accent-h);text-decoration:none;border-bottom:1px solid rgba(91,130,247,.3);}
.prose a:hover{border-bottom-color:var(--accent);}
.prose blockquote{
  border-left:3px solid var(--accent);
  padding:10px 16px;margin:14px 0;
  background:var(--accent-bg);border-radius:0 8px 8px 0;
  color:var(--text2);
}
.prose hr{border:none;border-top:1px solid var(--border2);margin:20px 0;}

/* Inline code */
.prose code{
  font-family:var(--mono);font-size:13px;
  background:var(--surface2);color:var(--accent-h);
  padding:2px 6px;border-radius:5px;
  border:1px solid var(--border2);
}

/* Code blocks */
.code-block{
  margin:14px 0;border-radius:var(--radius);
  border:1px solid var(--border2);
  overflow:hidden;
  background:var(--code-bg);
}
.code-header{
  display:flex;align-items:center;
  padding:8px 14px;
  background:rgba(255,255,255,.04);
  border-bottom:1px solid var(--border);
}
.code-lang{
  font-family:var(--mono);font-size:11px;
  font-weight:500;color:var(--muted);
  text-transform:lowercase;
  flex:1;
}
.copy-btn{
  font-size:11px;font-family:var(--font);font-weight:500;
  background:none;border:1px solid var(--border2);
  color:var(--muted);border-radius:5px;
  padding:3px 10px;cursor:pointer;transition:all .12s;
}
.copy-btn:hover{color:var(--text);border-color:var(--border2);background:var(--surface2);}
.copy-btn.ok{color:var(--green);border-color:rgba(52,201,122,.3);}
.code-block pre{
  padding:16px;overflow-x:auto;
  font-family:var(--mono);font-size:13px;
  line-height:1.65;color:var(--code-text);
  margin:0;
}
.code-block pre::-webkit-scrollbar{height:4px;}
.code-block pre::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px;}

/* Typing */
.typing-dots{display:flex;gap:5px;align-items:center;padding:4px 0;}
.typing-dots span{
  width:7px;height:7px;border-radius:50%;
  background:var(--dim);display:block;
  animation:tdot 1.4s infinite;
}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes tdot{0%,80%,100%{transform:scale(.8);opacity:.4}40%{transform:scale(1.1);opacity:1}}

/* Error */
.err-row{color:var(--red);font-size:13px;display:flex;align-items:flex-start;gap:8px;padding:10px 14px;background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.15);border-radius:var(--radius);}

/* Stream cursor */
.cur{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:text-bottom;animation:blink .7s step-end infinite;}
@keyframes blink{50%{opacity:0}}

/* Row actions */
.row-actions{margin-top:10px;display:flex;gap:6px;opacity:0;transition:opacity .15s;}
.msg-row:hover .row-actions{opacity:1;}
.act-btn{
  font-size:11px;font-weight:500;font-family:var(--font);
  background:none;border:1px solid var(--border2);
  color:var(--muted);border-radius:5px;
  padding:3px 10px;cursor:pointer;transition:all .12s;
  display:flex;align-items:center;gap:5px;
}
.act-btn:hover{color:var(--text);background:var(--surface2);}

/* ====== INPUT ====== */
.input-panel{
  padding:16px 32px 20px;
  border-top:1px solid var(--border);
  background:var(--bg2);
  flex-shrink:0;
}
.input-shell{
  max-width:780px;margin:0 auto;
}
.input-box{
  display:flex;align-items:flex-end;gap:10px;
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:12px;
  padding:10px 12px;
  transition:border-color .15s,box-shadow .15s;
}
.input-box:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(91,130,247,.12);
}
#inp{
  flex:1;border:none;background:none;outline:none;
  font-size:15px;font-family:var(--font);
  color:var(--text);line-height:1.6;
  resize:none;max-height:180px;min-height:24px;
}
#inp::placeholder{color:var(--dim);}
.send-wrap{display:flex;align-items:center;gap:8px;}
.send-btn{
  width:34px;height:34px;border-radius:8px;border:none;
  background:var(--accent);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .14s;flex-shrink:0;
}
.send-btn:hover:not(:disabled){background:var(--accent-h);}
.send-btn:disabled{opacity:.35;cursor:not-allowed;}

.input-meta{
  display:flex;justify-content:space-between;
  align-items:center;margin-top:8px;
  padding:0 2px;
}
.input-hint{font-size:11px;color:var(--dim);}
.char-count{font-size:11px;color:var(--dim);font-family:var(--mono);}
</style>
</head>
<body>
<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sb-header">
      <a class="logo">
        <div class="logo-mark">A</div>
        <div>
          <span class="logo-name">ARIA</span>
          <span class="logo-tag">Workspace</span>
        </div>
      </a>
      <button class="btn-new" onclick="newChat()" title="Ctrl+K">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
        <span class="kb">Ctrl K</span>
      </button>
    </div>

    <div class="sb-section">Conversations</div>
    <div class="convs" id="convs"></div>

    <div class="sb-bottom">
      <div class="theme-toggle" id="themeToggle">
        <button class="t-btn on" id="tb-dark" onclick="setTheme('dark')">&#9790; Dark</button>
        <button class="t-btn" id="tb-light" onclick="setTheme('light')">&#9728; Light</button>
      </div>
      <div class="sb-hint">Free &middot; No account &middot; Pollinations AI</div>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="main">

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="model-group">
        <button class="m-btn" data-m="fast" onclick="setModel('fast')">Fast</button>
        <button class="m-btn on" data-m="balanced" onclick="setModel('balanced')">Balanced</button>
        <button class="m-btn" data-m="smart" onclick="setModel('smart')">Smart</button>
      </div>
      <div class="divider"></div>
      <div class="status">
        <div class="live-dot"></div>
        <span id="statusTxt">Ready</span>
      </div>
      <div class="toolbar-right">
        <button class="icon-btn" onclick="clearChat()" title="Clear current chat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
    </div>

    <!-- Chat -->
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-body" id="chat"></div>
    </div>

    <!-- Input -->
    <div class="input-panel">
      <div class="input-shell">
        <div class="input-box">
          <textarea id="inp" placeholder="Ask anything…" rows="1"
            oninput="onInput()"
            onkeydown="onKey(event)"></textarea>
          <div class="send-wrap">
            <button class="send-btn" id="sendBtn" onclick="send()" disabled title="Enter">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
        <div class="input-meta">
          <span class="input-hint">Enter to send &nbsp;&middot;&nbsp; Shift+Enter for new line &nbsp;&middot;&nbsp; Ctrl+K new chat</span>
          <span class="char-count" id="charCount"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API   = 'https://text.pollinations.ai/openai';
const MDL   = { fast:'mistral', balanced:'openai', smart:'openai-large' };
const MDL_LABEL = { fast:'Mistral (Fast)', balanced:'GPT-4o (Balanced)', smart:'GPT-4o Large (Smart)' };
const SYS = `You are ARIA, a professional AI workspace assistant.
Be precise, thorough, and concise. Use markdown formatting:
- Code blocks with language tags for all code
- Bold for key terms
- Lists when enumerating items
- Tables for comparisons
Avoid unnecessary preamble. Get straight to the answer.`;

let convs    = JSON.parse(localStorage.getItem('a_convs')||'[]');
let activeId = localStorage.getItem('a_active')||null;
let model    = localStorage.getItem('a_model')||'balanced';
let busy     = false;

const save = () => {
  localStorage.setItem('a_convs',  JSON.stringify(convs.slice(0,60)));
  localStorage.setItem('a_active', activeId||'');
  localStorage.setItem('a_model',  model);
};

const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ts = () => new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

/* ====== MARKDOWN ====== */
const md = raw => {
  const blocks = [];
  // Extract code blocks first
  const parts = raw.split(/(```[\s\S]*?```)/g);
  let out = '';
  for (const part of parts) {
    if (part.startsWith('```')) {
      const nl = part.indexOf('\n');
      const lang = nl > 3 ? part.slice(3, nl).trim() : '';
      const code = nl > 3 ? part.slice(nl+1, -3) : part.slice(3,-3);
      const id = 'cb'+Math.random().toString(36).slice(2);
      out += `<div class="code-block">
        <div class="code-header">
          <span class="code-lang">${esc(lang)||'text'}</span>
          <button class="copy-btn" onclick="copyCode('${id}',this)" id="${id}btn">Copy</button>
        </div>
        <pre id="${id}">${esc(code.replace(/\n$/,''))}</pre>
      </div>`;
    } else {
      let h = esc(part);
      // inline code
      h = h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
      // bold / italic
      h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      h = h.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
      // headings
      h = h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
      h = h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
      h = h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
      // blockquote
      h = h.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
      // hr
      h = h.replace(/^---$/gm,'<hr>');
      // lists
      h = h.replace(/^[\*\-] (.+)$/gm,'<li>$1</li>');
      h = h.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
      h = h.replace(/(<li>[\s\S]+?<\/li>)/g,'<ul>$1</ul>');
      // paragraphs
      h = h.replace(/\n\n+/g,'</p><p>');
      h = '<p>'+h+'</p>';
      h = h.replace(/\n/g,'<br>');
      h = h.replace(/<p>(\s|<br>)*<\/p>/g,'');
      out += h;
    }
  }
  return out;
};

/* ====== COPY CODE ====== */
window.copyCode = (id, btn) => {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText).then(()=>{
    btn.textContent='Copied!'; btn.classList.add('ok');
    setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('ok'); }, 2000);
  });
};

/* ====== THEME ====== */
const setTheme = t => {
  document.body.classList.toggle('light', t==='light');
  document.getElementById('tb-dark').classList.toggle('on', t==='dark');
  document.getElementById('tb-light').classList.toggle('on', t==='light');
  localStorage.setItem('a_theme', t);
};

/* ====== MODEL ====== */
const setModel = m => {
  model = m; save();
  document.querySelectorAll('.m-btn').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  setStatus('Ready &middot; '+MDL_LABEL[m]);
};

const setStatus = s => document.getElementById('statusTxt').innerHTML = s;

/* ====== SIDEBAR ====== */
const renderSidebar = () => {
  const el = document.getElementById('convs');
  if (!convs.length) { el.innerHTML = '<div style="padding:12px 10px;font-size:12px;color:var(--dim)">No conversations yet</div>'; return; }
  el.innerHTML = convs.map(c=>{
    const first = c.msgs.find(m=>m.role==='user');
    const title = first ? first.content.slice(0,40) : 'New chat';
    const active = c.id === activeId;
    return `<div class="conv-item${active?' active':''}" onclick="loadConv('${c.id}')" title="${esc(title)}">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      ${esc(title)}
    </div>`;
  }).join('');
};

/* ====== EMPTY STATE ====== */
const showWelcome = () => {
  document.getElementById('chat').innerHTML = `
  <div class="welcome">
    <h1>Good to have you, let's work.</h1>
    <p>Ask me anything — code, analysis, writing, research. I remember your conversation.</p>
    <div class="starter-grid">
      <div class="starter" onclick="quick('Explain the difference between async/await and Promises in JavaScript with examples')">
        <div class="starter-title">Async / Await vs Promises</div>
        <div class="starter-sub">JavaScript deep dive</div>
      </div>
      <div class="starter" onclick="quick('Write a professional market research report outline for a SaaS product')">
        <div class="starter-title">Market Research Report</div>
        <div class="starter-sub">Business analysis</div>
      </div>
      <div class="starter" onclick="quick('What are the best practices for designing a scalable REST API?')">
        <div class="starter-title">REST API Best Practices</div>
        <div class="starter-sub">System design</div>
      </div>
      <div class="starter" onclick="quick('Debug this: I need help optimizing a slow SQL query')">
        <div class="starter-title">SQL Optimization</div>
        <div class="starter-sub">Database performance</div>
      </div>
    </div>
  </div>`;
};

const quick = text => { document.getElementById('inp').value = text; onInput(); send(); };

/* ====== MESSAGES ====== */
const addRow = (role, content='', opts={}) => {
  const chat = document.getElementById('chat');
  const id = 'r'+Date.now()+Math.random().toString(36).slice(2,6);
  const isUser = role === 'user';
  const avatarCls = isUser ? 'user' : 'aria';
  const avatarTxt = isUser ? 'U' : 'A';

  let body = '';
  if (opts.typing) {
    body = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
  } else if (opts.error) {
    body = `<div class="err-row">⚠️ &nbsp;${esc(content)}</div>`;
  } else if (isUser) {
    body = `<div class="row-text">${esc(content)}</div>
    <div class="row-actions">
      <button class="act-btn" onclick="copyTxt('${id}-body')"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button>
    </div>`;
  } else {
    body = `<div class="prose" id="${id}-prose">${md(content)}</div>
    <div class="row-actions">
      <button class="act-btn" onclick="copyTxt('${id}-prose')"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button>
    </div>`;
  }

  chat.insertAdjacentHTML('beforeend', `
  <div class="msg-row" id="${id}">
    <div class="row-avatar ${avatarCls}">${avatarTxt}</div>
    <div class="row-content" id="${id}-body">
      <div class="row-meta">
        <span class="row-name">${isUser?'You':'ARIA'}</span>
        <span class="row-time">${ts()}</span>
      </div>
      ${body}
    </div>
  </div>`);

  scrollBottom();
  return id;
};

const updateRow = (id, text, done=false) => {
  const prose = document.getElementById(id+'-prose');
  if (!prose) return;
  prose.innerHTML = md(text) + (done ? '' : '<span class="cur"></span>');
  scrollBottom();
};

const scrollBottom = () => {
  const s = document.getElementById('chatScroll');
  s.scrollTop = s.scrollHeight;
};

window.copyTxt = id => {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText);
};

/* ====== CONVERSATIONS ====== */
const newChat = () => {
  const id = Date.now().toString(36);
  convs.unshift({id, msgs:[], created:Date.now()});
  activeId = id;
  save(); renderSidebar(); showWelcome();
  document.getElementById('inp').focus();
};

const loadConv = id => {
  activeId = id; save(); renderSidebar();
  const conv = convs.find(c=>c.id===id);
  const chat = document.getElementById('chat');
  if (!conv?.msgs.length) { showWelcome(); return; }
  chat.innerHTML = '';
  for (const m of conv.msgs) {
    if (m.role==='user') addRowStatic('user', m.content);
    else addRowStatic('assistant', m.content, m.error);
  }
};

const addRowStatic = (role, content, error=false) => {
  const chat = document.getElementById('chat');
  const isUser = role==='user';
  const id = 'r'+Date.now()+Math.random().toString(36).slice(2,5);
  let body;
  if (error) body = `<div class="err-row">⚠️ &nbsp;${esc(content)}</div>`;
  else if (isUser) body = `<div class="row-text">${esc(content)}</div>`;
  else body = `<div class="prose">${md(content)}</div>`;

  chat.insertAdjacentHTML('beforeend',`
  <div class="msg-row">
    <div class="row-avatar ${isUser?'user':'aria'}">${isUser?'U':'A'}</div>
    <div class="row-content">
      <div class="row-meta">
        <span class="row-name">${isUser?'You':'ARIA'}</span>
      </div>${body}
    </div>
  </div>`);
  scrollBottom();
};

const clearChat = () => {
  const conv = convs.find(c=>c.id===activeId);
  if (conv) conv.msgs = [];
  save(); showWelcome();
};

/* ====== SEND ====== */
const send = async () => {
  if (busy) return;
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;

  let conv = convs.find(c=>c.id===activeId);
  if (!conv) { newChat(); conv = convs.find(c=>c.id===activeId); }
  if (!conv.msgs.length) document.getElementById('chat').innerHTML = '';

  conv.msgs.push({role:'user', content:text});
  inp.value=''; inp.style.height='auto';
  document.getElementById('charCount').textContent='';
  busy=true; updateSend(); save();

  addRow('user', text);
  const tid = addRow('assistant','',{typing:true});
  setStatus('Thinking…');

  try {
    const r = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model: MDL[model],
        messages:[
          {role:'system', content:SYS},
          ...conv.msgs.map(m=>({role:m.role, content:m.content}))
        ],
        stream:true,
      })
    });

    if (!r.ok) throw new Error(`Error ${r.status}`);

    // Replace typing indicator with prose container
    const rowEl = document.getElementById(tid);
    if (rowEl) {
      rowEl.querySelector('.row-content').innerHTML = `
        <div class="row-meta"><span class="row-name">ARIA</span><span class="row-time">${ts()}</span></div>
        <div class="prose" id="${tid}-prose"></div>
        <div class="row-actions">
          <button class="act-btn" onclick="copyTxt('${tid}-prose')"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button>
        </div>`;
    }

    const reader = r.body.getReader(); const dec = new TextDecoder();
    let full = '';
    while(true){
      const {done,value} = await reader.read(); if(done) break;
      for(const line of dec.decode(value).split('\n')){
        if(!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim(); if(raw==='[DONE]') break;
        try{ const d = JSON.parse(raw)?.choices?.[0]?.delta?.content||''; if(d){full+=d; updateRow(tid,full);} }catch{}
      }
    }
    updateRow(tid, full, true);
    conv.msgs.push({role:'assistant', content:full});
    setStatus('Done &middot; '+MDL_LABEL[model]);

  } catch(e) {
    const rowEl = document.getElementById(tid);
    if (rowEl) rowEl.querySelector('.row-content').innerHTML =
      `<div class="row-meta"><span class="row-name">ARIA</span></div><div class="err-row">⚠️ ${esc(e.message)}</div>`;
    conv.msgs.push({role:'assistant', content:e.message, error:true});
    setStatus('Error — try again');
  }

  save(); renderSidebar();
  busy=false; updateSend();
  document.getElementById('inp').focus();
};

/* ====== INPUT HANDLING ====== */
const onInput = () => {
  const inp = document.getElementById('inp');
  inp.style.height='auto';
  inp.style.height = Math.min(inp.scrollHeight, 180)+'px';
  const n = inp.value.length;
  document.getElementById('charCount').textContent = n > 100 ? n+' chars' : '';
  updateSend();
};

const updateSend = () => {
  document.getElementById('sendBtn').disabled = busy || !document.getElementById('inp').value.trim();
};

const onKey = e => {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); }
};

/* ====== KEYBOARD SHORTCUTS ====== */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='k') { e.preventDefault(); newChat(); }
  if (e.key==='/' && document.activeElement.tagName!=='TEXTAREA') {
    e.preventDefault(); document.getElementById('inp').focus();
  }
});

/* ====== INIT ====== */
const theme = localStorage.getItem('a_theme')||'dark';
setTheme(theme);
setModel(model);

if (!convs.length || !convs.find(c=>c.id===activeId)) {
  newChat();
} else {
  renderSidebar();
  loadConv(activeId);
}
</script>
</body>
</html>
