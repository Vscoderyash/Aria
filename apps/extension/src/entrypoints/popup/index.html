<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS</title><style>body{width:300px;font:14px system-ui;padding:14px;background:#14181c;color:#e7ece9}input{width:100%;padding:8px;margin:8px 0;background:#0e1215;border:1px solid #38414a;color:#fff;border-radius:6px}button{background:#ff5a1f;color:#fff;border:0;padding:8px 14px;border-radius:999px;cursor:pointer}small{color:#9aa6ae}</style></head><body><b style="font:700 16px monospace;letter-spacing:.2em;color:#19d3ff">J.A.R.V.I.S</b><br><small>Press Alt+J on any page, or click the orb.</small>
<input id="u" placeholder="https://jarvisv02.vercel.app/api/chat"><button id="s">Save</button> <button id="t">Test</button> <button id="w" style="background:#19d3ff;color:#001018">Wake JARVIS</button><br><small>Voice language</small><select id="l" style="width:100%;padding:8px;margin:6px 0;background:#0e1215;color:#fff;border:1px solid #38414a;border-radius:6px"><option value="">Auto</option><option value="en-IN">English (India) + Hinglish</option><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="hi-IN">Hindi</option></select><br><small>Voice (Edge: pick a "Natural" male voice for the best sound)</small><select id="v" style="width:100%;padding:8px;margin:6px 0;background:#0e1215;color:#fff;border:1px solid #38414a;border-radius:6px"></select><small>Size</small><select id="z" style="width:100%;padding:8px;margin:6px 0;background:#0e1215;color:#fff;border:1px solid #38414a;border-radius:6px"><option value="auto">Auto (fits the screen)</option><option value="s">Small</option><option value="m">Medium</option><option value="l">Large</option></select><small>Brain</small><select id="br" style="width:100%;padding:8px;margin:6px 0;background:#0e1215;color:#fff;border:1px solid #38414a;border-radius:6px"><option value="fast">Fast (quick replies)</option><option value="smart">Smart (stronger reasoning, slower)</option></select><small id="tr"></small><br><button id="ex" style="margin:6px 4px 0 0">Export training</button><button id="im" style="margin:6px 4px 0 0">Import</button><button id="rs" style="margin-top:6px;background:#38414a">Reset</button><input type="file" id="fi" accept=".json" style="display:none"><br><small id="c"></small><br><small id="m"></small>
<script type="module" src="./main.ts"></script></body></html>
